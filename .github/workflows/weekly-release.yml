name: Daily npm release

on:
  schedule:
    - cron: '21 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-npm-release-${{ github.repository }}
  cancel-in-progress: false

# plan runs daily without secrets. Only when a release is due does release wait
# for approval in the `release` environment (main only, required reviewers),
# which holds RELEASE_APP_PRIVATE_KEY. publish then waits in the `npm`
# environment, the only identity npm's trusted publisher accepts.
jobs:
  plan:
    name: Decide whether a release is due
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan without changing the tree
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/weekly-release.mjs > "$RUNNER_TEMP/weekly-release-plan.json"
          cat "$RUNNER_TEMP/weekly-release-plan.json"
          action=$(jq -r .action "$RUNNER_TEMP/weekly-release-plan.json")
          version=$(jq -r .version "$RUNNER_TEMP/weekly-release-plan.json")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$action" == publish ]]; then
            echo "Release due: ${GITHUB_REPOSITORY} ${version}. Approve the \`release\` deployment, then \`npm\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Tag the approved release
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      package_name: ${{ steps.pack.outputs.package_name }}
    # This job holds the release App key, so every action is pinned to a commit.
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      # pnpm/action-setup v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: github.repository == 'neatlogs/neatlogs-wizard'
        with:
          version: 10

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Apply the approved plan
        id: plan
        shell: bash
        env:
          APPROVED_ACTION: ${{ needs.plan.outputs.action }}
          APPROVED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/weekly-release.mjs --apply > "$RUNNER_TEMP/weekly-release-plan.json"
          cat "$RUNNER_TEMP/weekly-release-plan.json"
          action=$(jq -r .action "$RUNNER_TEMP/weekly-release-plan.json")
          version=$(jq -r .version "$RUNNER_TEMP/weekly-release-plan.json")
          if [[ "$action" != "$APPROVED_ACTION" || "$version" != "$APPROVED_VERSION" ]]; then
            echo "::error::The plan changed after approval (approved ${APPROVED_ACTION} ${APPROVED_VERSION}, now ${action} ${version}); rerun the workflow" >&2
            exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bump=$(jq -r '.bump // false' "$RUNNER_TEMP/weekly-release-plan.json")" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.commit // false' "$RUNNER_TEMP/weekly-release-plan.json")" >> "$GITHUB_OUTPUT"
          echo "retry_tag=$(jq -r '.retry_tag // empty' "$RUNNER_TEMP/weekly-release-plan.json")" >> "$GITHUB_OUTPUT"

      - name: Restore exact source of an unpublished tagged release
        if: steps.plan.outputs.retry_tag != ''
        env:
          RETRY_TAG: ${{ steps.plan.outputs.retry_tag }}
        run: git checkout --detach "$RETRY_TAG"

      - name: Build and validate the exact package to publish
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            neatlogs/neatlogs-typescript)
              npm ci --ignore-scripts --no-audit --no-fund
              npm run lint
              npm test
              npm pack --dry-run
              ;;
            neatlogs/neatlogs-wizard)
              pnpm install --frozen-lockfile
              pnpm typecheck
              pnpm test
              pnpm build
              pnpm pack --pack-destination "$RUNNER_TEMP"
              ;;
            neatlogs/neatlogs-claude-code)
              npm ci --ignore-scripts --no-audit --no-fund
              npm run build
              node -e "const p=require('./package.json');const m=require('./.claude-plugin/plugin.json');if(p.version!==m.version)process.exit(1)"
              npm pack --dry-run
              ;;
            neatlogs/neatlogs-codex)
              npm ci --ignore-scripts --no-audit --no-fund
              npm run typecheck
              npm test
              npm pack --dry-run
              ;;
            *) echo "Unsupported repository: $GITHUB_REPOSITORY" >&2; exit 1 ;;
          esac

      - name: Verify release App configuration
        shell: bash
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_ID" || { echo 'RELEASE_APP_ID secret is missing' >&2; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo 'RELEASE_APP_PRIVATE_KEY secret is missing' >&2; exit 1; }

      - name: Create a repository-scoped release token
        id: release-token
        # actions/create-github-app-token v2.2.2
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit synchronized version and tag the release
        shell: bash
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name 'neatlogs-release[bot]'
          git config user.email 'neatlogs-release[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$RELEASE_COMMIT" == 'true' ]]; then
            case "$GITHUB_REPOSITORY" in
              neatlogs/neatlogs-typescript) git add package.json package-lock.json src/version.ts ;;
              neatlogs/neatlogs-wizard) git add package.json pnpm-lock.yaml ;;
              neatlogs/neatlogs-claude-code) git add package.json package-lock.json .claude-plugin/plugin.json ;;
              neatlogs/neatlogs-codex) git add package.json package-lock.json .codex-plugin/plugin.json README.md ;;
            esac
            git diff --cached --check
            git commit -m "chore(release): ${RELEASE_VERSION}"
            # A concurrent merge makes this fast-forward push fail. In that case
            # the job stops before tagging or publishing a different source tree.
            git push origin HEAD:refs/heads/main
          fi
          # The published artifact must come from the exact tagged source tree.
          git diff --exit-code
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Existing ${tag} points to another commit" >&2
              exit 1
            }
          else
            git tag -a "$tag" -m "Release ${RELEASE_VERSION}"
          fi
          git push origin "refs/tags/${tag}"

      - name: Pack the tagged source tree
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # npm pack does not create its destination and fails with ENOENT.
          # ci.yml runs this script as written, so pass values in through env.
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          git diff --exit-code
          echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Hand the packed tarball to the publish job
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.release.outputs.package_name }}/v/${{ needs.release.outputs.version }}
    permissions:
      id-token: write
    # This job can publish to npm, so every action is pinned to a commit.
    steps:
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Download the tested tarball
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: npm-package

      - name: Publish through npm trusted publishing
        # A version commit created inside this run changes HEAD after the
        # workflow's GITHUB_SHA was set. Avoid an incorrect source attestation.
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          tarballs=(npm-package/*.tgz)
          test "${#tarballs[@]}" -eq 1 && test -f "${tarballs[0]}"
          npm publish "${tarballs[0]}" --access public

      - name: Verify the published version
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.release.outputs.package_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            # npm publish can return while the public registry is still
            # processing the package. Revalidate online until it exposes the
            # exact version, without trusting a cached response.
            published=$(npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version \
              --registry=https://registry.npmjs.org/ --prefer-online \
              --fetch-retries=0 --fetch-timeout=15000 \
              --cache "$RUNNER_TEMP/npm-release-verify-cache" 2>/dev/null || true)
            if [[ "$published" == "$RELEASE_VERSION" ]]; then
              echo "Published ${PACKAGE_NAME}@${RELEASE_VERSION}"
              exit 0
            fi
            if (( SECONDS >= deadline )); then break; fi
            echo "npm has not confirmed ${PACKAGE_NAME}@${RELEASE_VERSION} (check ${attempt}); retrying in 15 seconds"
            sleep 15
          done
          echo "::error::npm publish succeeded, but the registry did not confirm exact version ${PACKAGE_NAME}@${RELEASE_VERSION} within 10 minutes; inspect the package before retrying" >&2
          exit 1

  notify:
    name: Notify Slack after verified npm publication
    needs: [release, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post release notification
        shell: bash
        env:
          # Incoming webhooks are channel-bound; configure this one for #released-artifacts (C0C6P2PU1UN).
          SLACK_WEBHOOK_URL: ${{ secrets.RELEASE_SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$SLACK_WEBHOOK_URL" || { echo 'RELEASE_SLACK_WEBHOOK_URL is missing' >&2; exit 1; }
          message=":white_check_mark: *TypeScript SDK neatlogs@${RELEASE_VERSION} published to npm*"
          message+=$'\n'
          message+="<https://www.npmjs.com/package/neatlogs/v/${RELEASE_VERSION}|npm package> · <https://github.com/${GITHUB_REPOSITORY}/tree/v${RELEASE_VERSION}|Release tag> · <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Workflow run>"
          payload=$(jq -n --arg text "$message" '{text: $text}')
          response=$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 \
            --header 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL")
          test "$response" = ok || { echo "Slack webhook returned an unexpected response: $response" >&2; exit 1; }
