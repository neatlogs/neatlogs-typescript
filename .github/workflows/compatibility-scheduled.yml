name: Compatibility release discovery

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      upstream_issue_url:
        description: "Optional public GitHub issue to exercise the full issue-evidence alert path"
        required: false
        type: string
      upstream_issue_package:
        description: "Package to isolate when exercising an upstream issue"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changes_found: ${{ steps.discovery.outputs.changes_found }}
      proposal_ready: ${{ steps.propose_fix.outputs.proposal_ready }}
      issue_url: ${{ steps.discovery_issue.outputs.issue_url }}
      verify_outcome: ${{ steps.verify_releases.outcome }}
      proposal_outcome: ${{ steps.propose_fix.outcome }}
      prior_prs_outcome: ${{ steps.prior_prs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Discover npm releases
        id: discovery
        run: node scripts/compatibility/discover-releases.mjs --report=compatibility-release-report.json
      - name: Build SDK for isolated consumer checks
        if: steps.discovery.outputs.changes_found == 'true'
        run: npm run build
      - name: Verify detected versions against recorded baselines
        id: verify_releases
        if: steps.discovery.outputs.changes_found == 'true'
        continue-on-error: true
        run: node scripts/compatibility/verify-releases.mjs
      - name: Capture upstream issue evidence
        if: inputs.upstream_issue_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ISSUE_URL: ${{ inputs.upstream_issue_url }}
        run: gh issue view "$UPSTREAM_ISSUE_URL" --json number,title,state,url,body,labels > compatibility-upstream-issue.json
      - name: Isolate the issue package
        if: inputs.upstream_issue_package != ''
        env:
          UPSTREAM_ISSUE_PACKAGE: ${{ inputs.upstream_issue_package }}
        run: |
          jq --arg package "$UPSTREAM_ISSUE_PACKAGE" '.changes = [.changes[] | select(.package == $package)]' compatibility-release-report.json > compatibility-release-report.tmp.json
          mv compatibility-release-report.tmp.json compatibility-release-report.json
          jq -e '.changes | length == 1' compatibility-release-report.json
      - name: Build deterministic upstream evidence
        if: steps.discovery.outputs.changes_found == 'true'
        run: npm run compatibility:evidence
      - name: Attach upstream issue evidence
        if: steps.discovery.outputs.changes_found == 'true' && inputs.upstream_issue_url != ''
        run: |
          jq --slurpfile issue compatibility-upstream-issue.json '.upstreamIssues = $issue' compatibility-evidence.json > compatibility-evidence.tmp.json
          mv compatibility-evidence.tmp.json compatibility-evidence.json
      - name: Run advisory Gemini impact analysis
        id: llm_analysis
        if: steps.discovery.outputs.changes_found == 'true'
        continue-on-error: true
        env:
          COMPAT_GEMINI_API_KEY: ${{ secrets.COMPAT_GEMINI_API_KEY }}
          COMPAT_GEMINI_MODEL: ${{ vars.COMPAT_GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: npm run compatibility:llm
      - name: List prior compatibility PRs
        id: prior_prs
        if: steps.discovery.outputs.changes_found == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --json headRefName,url > compatibility-existing-prs.json
      - name: Ask Gemini for one specific SDK fix
        id: propose_fix
        if: always() && steps.discovery.outputs.changes_found == 'true' && steps.verify_releases.outcome != 'skipped' && steps.prior_prs.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          COMPAT_GEMINI_API_KEY: ${{ secrets.COMPAT_GEMINI_API_KEY }}
          COMPAT_GEMINI_MODEL: ${{ vars.COMPAT_GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: node scripts/compatibility/propose-fix.mjs
      - name: Create or update discovery issue
        id: discovery_issue
        if: always() && steps.discovery.outputs.changes_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('compatibility-release-report.json', 'utf8'));
            const analysis = fs.existsSync('compatibility-llm-analysis.json')
              ? JSON.parse(fs.readFileSync('compatibility-llm-analysis.json', 'utf8'))
              : { unavailable: true };
            const verification = fs.existsSync('compatibility-verification.json')
              ? JSON.parse(fs.readFileSync('compatibility-verification.json', 'utf8'))
              : { counts: { passed: 0, failed: 0, blocked: 0, 'not-tested': report.changes.length }, packages: [] };
            const proposal = fs.existsSync('compatibility-fix-proposal.json')
              ? JSON.parse(fs.readFileSync('compatibility-fix-proposal.json', 'utf8'))
              : { decision: 'review_only', reason: 'Fix proposal did not run', unproposedCandidates: [] };
            const title = '[compatibility] New TypeScript integration releases detected';
            const rows = report.changes.map((change) => {
              const result = verification.packages.find((item) => item.package === change.package);
              return `| ${change.package} | ${change.previouslyAnalyzed ?? 'not recorded'} | ${change.latest} | ${result?.status ?? 'not-tested'} | ${result?.scope ?? 'check did not run'} |`;
            }
            ).join('\n');
            const body = [
              'The scheduled compatibility monitor found upstream releases newer than the recorded-version lockfile.',
              '',
              'Deterministic checks install a tarball built from this Neatlogs checkout with each exact recorded baseline and detected version in isolated npm consumers. The reported scope is a bounded runtime smoke probe, not complete SDK compatibility. A failed latest probe after a passing baseline is a candidate regression requiring triage. Blocked and not-tested mean compatibility is unknown.',
              '',
              `Smoke checks: ${verification.counts.passed} passed, ${verification.counts.failed} candidate regressions, ${verification.counts.blocked} blocked, ${verification.counts['not-tested']} not tested. See the workflow artifact for the baseline/latest result and any failure detail.`,
              '',
              '| Package | Recorded baseline | Detected version | Smoke result | Check scope |',
              '| --- | --- | --- | --- | --- |',
              rows,
              '',
              '### Automated fix proposal',
              `Decision: ${proposal.decision}. ${proposal.reason ?? ''}`,
              'Validation: pending or not run.',
              'Review PR: pending or not created.',
              `Candidates deferred or not proposed: ${(proposal.unproposedCandidates ?? []).join(', ') || 'none'}.`,
              'A ready-for-review PR is opened only for a specific SDK source and test patch that passes validation; no change is approved or merged automatically.',
              '',
              '### Unverified Gemini advisory analysis',
              'Gemini provides an advisory assessment from upstream package evidence and adapter source. Its findings are separate from the deterministic smoke results and require review.',
              '',
              '```json',
              JSON.stringify(analysis, null, 2),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === title && !issue.pull_request);
            let issue;
            if (existing) {
              issue = await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              issue = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
            core.setOutput('issue_url', issue.data.html_url);
      - name: Upload discovery and proposal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-compatibility-release-report
          path: |
            compatibility-release-report.json
            compatibility-evidence.json
            compatibility-llm-analysis.json
            compatibility-verification.json
            compatibility-fix-proposal.json
            compatibility-existing-prs.json
            compatibility-upstream-issue.json
          if-no-files-found: ignore
          retention-days: 14

  validate_fix:
    needs: discover
    if: always() && needs.discover.outputs.proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
      validation_outcome: ${{ steps.validate.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download original proposal and evidence
        uses: actions/download-artifact@v4
        with:
          name: typescript-compatibility-release-report
      - name: Build unchanged SDK for baseline test
        run: npm run build
      - name: Validate proposed patch in read-only job
        id: validate
        continue-on-error: true
        run: node scripts/compatibility/validate-fix.mjs
      - name: Upload validation outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-compatibility-fix-validation
          path: compatibility-fix-validation.json
          if-no-files-found: ignore
          retention-days: 14

  publish_fix:
    needs: [discover, validate_fix]
    if: always() && needs.validate_fix.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.publish.outputs.pr_url }}
      publish_outcome: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download original proposal
        uses: actions/download-artifact@v4
        with:
          name: typescript-compatibility-release-report
      - name: Download read-only validation result
        uses: actions/download-artifact@v4
        with:
          name: typescript-compatibility-fix-validation
          path: validation-report
      - name: Recheck patch and open or reuse review PR
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COMPAT_PR_TOKEN || github.token }}
          COMPAT_VALIDATION_FILE: validation-report/compatibility-fix-validation.json
          COMPAT_DISCOVERY_ISSUE_URL: ${{ needs.discover.outputs.issue_url }}
          COMPAT_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/compatibility/publish-fix.mjs
      - name: Upload PR publication outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-compatibility-fix-publication
          path: compatibility-fix-publication.json
          if-no-files-found: ignore
          retention-days: 14

  notify:
    needs: [discover, validate_fix, publish_fix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download discovery and proposal results
        if: needs.discover.outputs.changes_found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: typescript-compatibility-release-report
      - name: Download validation result
        if: needs.validate_fix.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: typescript-compatibility-fix-validation
      - name: Download PR publication result
        if: needs.publish_fix.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: typescript-compatibility-fix-publication
      - name: Update discovery issue with fix outcome
        if: needs.discover.outputs.issue_url != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMPAT_DISCOVERY_ISSUE_URL: ${{ needs.discover.outputs.issue_url }}
          COMPAT_PR_URL: ${{ needs.publish_fix.outputs.pr_url }}
          COMPAT_VALIDATION_JOB_STATUS: ${{ needs.validate_fix.result }}
          COMPAT_PUBLICATION_JOB_STATUS: ${{ needs.publish_fix.result }}
        with:
          script: |
            const fs = require('node:fs');
            const issueNumber = Number(new URL(process.env.COMPAT_DISCOVERY_ISSUE_URL).pathname.split('/').pop());
            const validation = fs.existsSync('compatibility-fix-validation.json')
              ? JSON.parse(fs.readFileSync('compatibility-fix-validation.json', 'utf8')) : null;
            const publication = fs.existsSync('compatibility-fix-publication.json')
              ? JSON.parse(fs.readFileSync('compatibility-fix-publication.json', 'utf8')) : null;
            const current = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber });
            const body = current.data.body
              .replace(/^Validation:.*$/m, `Validation: ${validation?.status ?? (process.env.COMPAT_VALIDATION_JOB_STATUS === 'failure' ? 'failed before report' : 'not run')}${validation?.reason ? ` (${validation.reason})` : ''}. Targeted test on original SDK: ${validation?.baselineTargetedTest ?? 'not run'}.`)
              .replace(/^Review PR:.*$/m, `Review PR: ${publication?.url || process.env.COMPAT_PR_URL || (publication?.priorPrUrl ? `${publication.priorPrUrl} (left unchanged: ${publication.reason})` : publication?.reason) || (process.env.COMPAT_PUBLICATION_JOB_STATUS === 'failure' ? 'publication failed before report' : 'not created')}.`);
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body });
      - name: Notify Slack of release and fix outcome
        continue-on-error: true
        env:
          COMPAT_SLACK_WEBHOOK_URL: ${{ secrets.COMPAT_SLACK_WEBHOOK_URL }}
          COMPAT_JOB_STATUS: ${{ needs.discover.result }}
          COMPAT_CHANGES_FOUND: ${{ needs.discover.outputs.changes_found }}
          COMPAT_DISCOVERY_ISSUE_URL: ${{ needs.discover.outputs.issue_url }}
          COMPAT_VERIFICATION_OUTCOME: ${{ needs.discover.outputs.verify_outcome }}
          COMPAT_PROPOSAL_OUTCOME: ${{ needs.discover.outputs.proposal_outcome }}
          COMPAT_PROPOSAL_READY: ${{ needs.discover.outputs.proposal_ready }}
          COMPAT_PRIOR_PRS_OUTCOME: ${{ needs.discover.outputs.prior_prs_outcome }}
          COMPAT_VALIDATION_OUTCOME: ${{ needs.validate_fix.outputs.validation_outcome }}
          COMPAT_PUBLICATION_OUTCOME: ${{ needs.publish_fix.outputs.publish_outcome }}
          COMPAT_VALIDATION_JOB_STATUS: ${{ needs.validate_fix.result }}
          COMPAT_PUBLICATION_JOB_STATUS: ${{ needs.publish_fix.result }}
          COMPAT_PR_URL: ${{ needs.publish_fix.outputs.pr_url }}
        run: node scripts/compatibility/notify-slack.mjs
      - name: Fail run for candidate regression or fix automation failure
        if: always() && (needs.discover.outputs.verify_outcome == 'failure' || needs.discover.outputs.proposal_outcome == 'failure' || needs.discover.outputs.prior_prs_outcome == 'failure' || needs.validate_fix.result == 'failure' || needs.validate_fix.outputs.validation_outcome == 'failure' || (needs.discover.outputs.proposal_ready == 'true' && needs.validate_fix.result == 'skipped') || needs.publish_fix.result == 'failure' || needs.publish_fix.outputs.publish_outcome == 'failure' || (needs.validate_fix.outputs.validated == 'true' && needs.publish_fix.result == 'skipped'))
        run: exit 1
