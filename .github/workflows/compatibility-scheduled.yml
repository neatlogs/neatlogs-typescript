name: Compatibility release discovery

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover npm releases
        id: discovery
        run: node scripts/compatibility/discover-releases.mjs --report=compatibility-release-report.json
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: typescript-compatibility-release-report
          path: compatibility-release-report.json
          retention-days: 14
      - name: Create or update discovery issue
        if: steps.discovery.outputs.changes_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('compatibility-release-report.json', 'utf8'));
            const title = '[compatibility] New TypeScript integration releases detected';
            const rows = report.changes.map((change) =>
              `| ${change.package} | ${change.previouslyAnalyzed ?? 'not recorded'} | ${change.latest} | ${change.integrations.join(', ')} |`
            ).join('\n');
            const body = [
              'The scheduled compatibility monitor found releases that have not been analyzed.',
              '',
              '| Package | Previously analyzed | Latest | Integrations |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
