name: Compatibility release discovery

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      upstream_issue_url:
        description: "Optional public GitHub issue to exercise the full issue-evidence alert path"
        required: false
        type: string
      upstream_issue_package:
        description: "Package to isolate when exercising an upstream issue"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Discover npm releases
        id: discovery
        run: node scripts/compatibility/discover-releases.mjs --report=compatibility-release-report.json
      - name: Build SDK for isolated consumer checks
        if: steps.discovery.outputs.changes_found == 'true'
        run: npm run build
      - name: Verify detected versions against recorded baselines
        id: verify_releases
        if: steps.discovery.outputs.changes_found == 'true'
        continue-on-error: true
        run: node scripts/compatibility/verify-releases.mjs
      - name: Capture upstream issue evidence
        if: inputs.upstream_issue_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ISSUE_URL: ${{ inputs.upstream_issue_url }}
        run: gh issue view "$UPSTREAM_ISSUE_URL" --json number,title,state,url,body,labels > compatibility-upstream-issue.json
      - name: Isolate the issue package
        if: inputs.upstream_issue_package != ''
        env:
          UPSTREAM_ISSUE_PACKAGE: ${{ inputs.upstream_issue_package }}
        run: |
          jq --arg package "$UPSTREAM_ISSUE_PACKAGE" '.changes = [.changes[] | select(.package == $package)]' compatibility-release-report.json > compatibility-release-report.tmp.json
          mv compatibility-release-report.tmp.json compatibility-release-report.json
          jq -e '.changes | length == 1' compatibility-release-report.json
      - name: Build deterministic upstream evidence
        if: steps.discovery.outputs.changes_found == 'true'
        run: npm run compatibility:evidence
      - name: Attach upstream issue evidence
        if: steps.discovery.outputs.changes_found == 'true' && inputs.upstream_issue_url != ''
        run: |
          jq --slurpfile issue compatibility-upstream-issue.json '.upstreamIssues = $issue' compatibility-evidence.json > compatibility-evidence.tmp.json
          mv compatibility-evidence.tmp.json compatibility-evidence.json
      - name: Run advisory Gemini impact analysis
        if: steps.discovery.outputs.changes_found == 'true'
        continue-on-error: true
        env:
          COMPAT_GEMINI_API_KEY: ${{ secrets.COMPAT_GEMINI_API_KEY }}
          COMPAT_GEMINI_MODEL: ${{ vars.COMPAT_GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: npm run compatibility:llm
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-compatibility-release-report
          path: |
            compatibility-release-report.json
            compatibility-evidence.json
            compatibility-llm-analysis.json
            compatibility-verification.json
            compatibility-upstream-issue.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Create or update discovery issue
        id: discovery_issue
        if: always() && steps.discovery.outputs.changes_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('compatibility-release-report.json', 'utf8'));
            const analysis = fs.existsSync('compatibility-llm-analysis.json')
              ? JSON.parse(fs.readFileSync('compatibility-llm-analysis.json', 'utf8'))
              : { unavailable: true };
            const verification = fs.existsSync('compatibility-verification.json')
              ? JSON.parse(fs.readFileSync('compatibility-verification.json', 'utf8'))
              : { counts: { passed: 0, failed: 0, blocked: 0, 'not-tested': report.changes.length }, packages: [] };
            const title = '[compatibility] New TypeScript integration releases detected';
            const rows = report.changes.map((change) => {
              const result = verification.packages.find((item) => item.package === change.package);
              return `| ${change.package} | ${change.previouslyAnalyzed ?? 'not recorded'} | ${change.latest} | ${result?.status ?? 'not-tested'} | ${result?.scope ?? 'check did not run'} |`;
            }
            ).join('\n');
            const body = [
              'The scheduled compatibility monitor found upstream releases newer than the recorded-version lockfile.',
              '',
              'Deterministic checks install a tarball built from this Neatlogs checkout with each exact recorded baseline and detected version in isolated npm consumers. The reported scope is a bounded runtime smoke probe, not complete SDK compatibility. A failed latest probe after a passing baseline is a candidate regression requiring triage. Blocked and not-tested mean compatibility is unknown.',
              '',
              `Smoke checks: ${verification.counts.passed} passed, ${verification.counts.failed} candidate regressions, ${verification.counts.blocked} blocked, ${verification.counts['not-tested']} not tested. See the workflow artifact for the baseline/latest result and any failure detail.`,
              '',
              '| Package | Recorded baseline | Detected version | Smoke result | Check scope |',
              '| --- | --- | --- | --- | --- |',
              rows,
              '',
              '### Unverified Gemini advisory analysis',
              'Gemini provides an advisory assessment from upstream package evidence and adapter source. Its findings are separate from the deterministic smoke results and require review.',
              '',
              '```json',
              JSON.stringify(analysis, null, 2),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === title && !issue.pull_request);
            let issue;
            if (existing) {
              issue = await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              issue = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
            core.setOutput('issue_url', issue.data.html_url);
      - name: Notify Slack of releases or workflow failure
        if: always()
        continue-on-error: true
        env:
          COMPAT_SLACK_WEBHOOK_URL: ${{ secrets.COMPAT_SLACK_WEBHOOK_URL }}
          COMPAT_JOB_STATUS: ${{ job.status }}
          COMPAT_CHANGES_FOUND: ${{ steps.discovery.outputs.changes_found }}
          COMPAT_DISCOVERY_ISSUE_URL: ${{ steps.discovery_issue.outputs.issue_url }}
          COMPAT_VERIFICATION_FILE: compatibility-verification.json
          COMPAT_VERIFICATION_OUTCOME: ${{ steps.verify_releases.outcome }}
          COMPAT_UPSTREAM_ISSUE_FILE: compatibility-upstream-issue.json
        run: node scripts/compatibility/notify-slack.mjs
      - name: Fail run for candidate regression found by version checks
        if: always() && steps.verify_releases.outcome == 'failure'
        run: exit 1
